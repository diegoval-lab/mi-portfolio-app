name: CI - Build, Security and Push

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-security:
    runs-on: ubuntu-latest
    steps:
      # 1. Recuperamos la acción oficial para asegurarnos de que los ficheros se descargan correctamente
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en GHCR mediante CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Construir imagen Docker y configurar nombre en minúsculas
        run: |
          OWNER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${OWNER_REPO}/mi-app-node:${{ github.sha }}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          docker build -t $IMAGE_NAME .

      - name: Ejecutar escaneo de vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Subir imagen a GHCR
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.IMAGE_NAME }}

      - name: Guardar referencia de la imagen
        if: github.event_name == 'push'
        run: echo "${{ env.IMAGE_NAME }}" > image_ref.txt

      - name: Subir artefacto con la referencia
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: image-ref
          path: image_ref.txt
